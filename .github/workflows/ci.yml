name: Rust CI

on:
  push:
    branches: [master]
  pull_request:

# This fork is consumed as a Cargo Git dependency; no registry publishing.
permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    name: rust (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust crate and synthetic legacy fixtures
        run: cargo test --locked
      - name: Build Rust and cdylib
        run: cargo build --release --locked
