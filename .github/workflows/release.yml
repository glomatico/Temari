name: GitHub-only release

# Deliberately no PyPI, crates.io or Go-module publication.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, file: libtemari.so }
          - { os: ubuntu-24.04-arm, name: linux-arm64, file: libtemari.so }
          - { os: macos-latest, name: macos-arm64, file: libtemari.dylib }
          - { os: windows-latest, name: windows-x86_64, file: temari.dll }
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release --locked
      - name: Build native library
        run: cargo build --release --locked
      - name: Package library
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.file }}" "dist/temari-${{ matrix.name }}-${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: temari-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native-libraries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: temari-*
          merge-multiple: true
          path: dist
      - name: Publish binaries to GitHub Releases only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
